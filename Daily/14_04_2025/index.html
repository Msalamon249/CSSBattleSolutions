<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily 14 04 2025</title>
    <style>
      body {
        width: 400px;
        height: 300px;
        margin: 0;
        background: #343400;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      div {
        width: 250px;
        height: 160px;
        border-radius: 50%;
        background: #469dba;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .dot::before {
        content: "";
        position: absolute;
        height: 25px;
        width: 25px;
        top: 185px;
        left: 90px;
        background: #469dba;
      }
      .dot {
        height: 30px;
        width: 30px;
        background: #343400;
        box-shadow: 70px 0 #343400, -70px 0 #343400;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="dot"></div>
    </div>
  </body>
</html>
