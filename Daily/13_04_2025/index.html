<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>13 04 2025</title>
    <style>
      body {
        margin: 0;
        background: #e3cc9e;
        width: 400px;
        height: 300px;
      }
      div {
        position: absolute;
        left: 145px;
        top: 125px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #2a2753;
        box-shadow: 170px 0 #2a2753;
      }
      div::before {
        content: "";
        background: #2a2753;
        height: 50px;
        width: 100px;
        position: absolute;
        left: -110px;
        border-radius: 50px;
      }
      div::after {
        content: "";
        background: #2a2753;
        height: 50px;
        width: 100px;
        position: absolute;
        right: -110px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
