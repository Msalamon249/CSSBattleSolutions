<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        width: 400px;
        height: 300px;
        background: #62306d;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div {
        height: 100px;
        width: 100px;
        background: #f7ec7d;
        border-radius: 0 0 50% 50%;
        margin-top: 100px;
      }

      .mirror {
        margin-top: -100px;
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div></div>
    <div class="mirror"></div>
    <div></div>
  </body>
</html>
