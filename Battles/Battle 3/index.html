<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Push Button</title>
    <style>
      body {
        margin: 0;
        background: #6592cf;
        width: 300px;
        height: 400px;
      }
      .rectangle {
        margin: 75px 50px;
        width: 300px;
        height: 150px;
        background: #243d83;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .first-circle {
        height: 250px;
        width: 250px;
        border-radius: 50%;
        background: #6592cf;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .second-circle {
        height: 150px;
        width: 150px;
        background: #243d83;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .third-circle {
        background: #eeb850;
        height: 50px;
        width: 50px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="rectangle">
      <div class="first-circle">
        <div class="second-circle">
          <div class="third-circle"></div>
        </div>
      </div>
    </div>
  </body>
</html>
